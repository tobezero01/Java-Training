server:
  port: 9004
spring:
  application:
    name: customer-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  datasource:
    url: jdbc:mysql://localhost:3306/customer_eshopdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Bangkok
    username: root
    password: ducnhu1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:ducnhu1234}
    database: ${SPRING_REDIS_DATABASE:0}
    timeout: ${SPRING_REDIS_TIMEOUT:60s}
    ssl: ${SPRING_REDIS_SSL:false}

  security:
    jwt:
      issuer: ${JWT_ISSUER:eshop-customer-api}
      secret: ${JWT_SECRET:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:36000}

# Security config l?y t? common-service (JWT)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka