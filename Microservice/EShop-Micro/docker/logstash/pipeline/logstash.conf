input {
  http {
    host => "0.0.0.0"
    port => 5044
    codec => json     # body JSON -> event
  }
}

filter {
  # demo: thêm 1 field "env"
  mutate {
    add_field => { "env" => "local-dev" }
  }
}

output {
  # in ra log logstash
  stdout {
    codec => rubydebug
  }

  # đẩy lên Elasticsearch với index test-logs-YYYY.MM.dd
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "test-logs-%{+YYYY.MM.dd}"
  }
}
