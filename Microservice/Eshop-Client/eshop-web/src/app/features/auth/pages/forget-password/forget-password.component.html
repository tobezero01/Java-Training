<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h3 class="mb-4">Quên mật khẩu</h3>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" formControlName="email">
          <div class="text-danger small" *ngIf="form.controls.email.touched && form.controls.email.invalid">Email không
            hợp lệ</div>
        </div>
        <button class="btn btn-primary w-100" [disabled]="form.invalid || loading">Gửi hướng dẫn</button>
      </form>
    </div>
  </div>
</div>
