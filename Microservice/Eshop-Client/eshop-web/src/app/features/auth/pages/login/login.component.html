<div class="login-wrapper d-flex align-items-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <h1 class="h3 fw-bold text-gradient mb-1">eShop</h1>
              <p class="text-muted small">Chào mừng quay trở lại!</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">

              <div class="form-floating mb-3">
                <input type="email" formControlName="email" class="form-control" id="floatingInput"
                  placeholder="name@example.com" [class.is-invalid]="f.email.touched && f.email.invalid">
                <label for="floatingInput">Địa chỉ Email</label>
                <div class="invalid-feedback ps-2" *ngIf="f.email.errors?.['required']">Email không được để trống</div>
                <div class="invalid-feedback ps-2" *ngIf="f.email.errors?.['email']">Email không hợp lệ</div>
              </div>

              <div class="form-floating mb-3">
                <input type="password" formControlName="password" class="form-control" id="floatingPassword"
                  placeholder="Password" [class.is-invalid]="f.password.touched && f.password.invalid">
                <label for="floatingPassword">Mật khẩu</label>
                <div class="invalid-feedback ps-2">Vui lòng nhập mật khẩu</div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" formControlName="rememberMe" id="rememberMe">
                  <label class="form-check-label small text-secondary" for="rememberMe">
                    Ghi nhớ
                  </label>
                </div>
                <a routerLink="/forget-password" class="small text-decoration-none fw-semibold link-hover">
                  Quên mật khẩu?
                </a>
              </div>

              <button class="btn btn-primary w-100 btn-lg btn-gradient fw-bold mb-3"
                [disabled]="form.invalid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Đang xử lý...' : 'Đăng nhập' }}
              </button>

              <div class="text-center mb-3 position-relative">
                <span class="bg-white px-2 text-muted small position-relative z-1">Hoặc đăng nhập với</span>
                <hr class="position-absolute top-50 start-0 w-100 m-0 z-0">
              </div>

              <div class="d-flex gap-2 mb-4">
                <button type="button" class="btn btn-outline-light border text-dark w-50 btn-sm py-2">
                  <i class="bi bi-google me-1 text-danger"></i> Google
                </button>
                <button type="button" class="btn btn-outline-light border text-dark w-50 btn-sm py-2">
                  <i class="bi bi-facebook me-1 text-primary"></i> Facebook
                </button>
              </div>

              <div class="text-center small text-muted">
                Bạn chưa có tài khoản?
                <a routerLink="/register" class="text-gradient fw-bold text-decoration-none">Đăng ký ngay</a>
              </div>

            </form>
          </div>
        </div>
        <div class="text-center mt-4 text-muted small opacity-75">
          &copy; 2025 eShop. All rights reserved.
        </div>

      </div>
    </div>
  </div>
</div>
