<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h3 class="mb-4">Đăng nhập</h3>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" formControlName="email" class="form-control" placeholder="you@example.com">
          <div class="text-danger small" *ngIf="f.email.touched && f.email.invalid">Email không hợp lệ</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input type="password" formControlName="password" class="form-control" placeholder="••••••">
          <div class="text-danger small" *ngIf="f.password.touched && f.password.invalid">Bắt buộc</div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" formControlName="rememberMe" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
        </div>

        <button class="btn btn-primary w-100" [disabled]="form.invalid || loading">Đăng nhập</button>

        <div class="mt-3 text-end">
          <a routerLink="/forget-password" class="link-secondary small">Quên mật khẩu?</a>
        </div>
      </form>
    </div>
  </div>
</div>
