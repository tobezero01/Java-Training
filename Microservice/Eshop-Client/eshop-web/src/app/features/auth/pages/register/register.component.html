<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3 class="mb-4">Đăng ký tài khoản</h3>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Họ</label>
            <input class="form-control" formControlName="firstName">
            <div class="text-danger small" *ngIf="f.firstName.touched && f.firstName.invalid">
              Họ là bắt buộc
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Tên</label>
            <input class="form-control" formControlName="lastName">
            <div class="text-danger small" *ngIf="f.lastName.touched && f.lastName.invalid">
              Tên là bắt buộc
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" formControlName="email">
          <div class="text-danger small" *ngIf="f.email.touched && f.email.invalid">
            Email không hợp lệ
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Mật khẩu</label>
            <input class="form-control" type="password" formControlName="password">
            <div class="text-danger small" *ngIf="f.password.touched && f.password.hasError('weakPassword')">
              Mật khẩu tối thiểu 6 ký tự, gồm chữ và số
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Xác nhận mật khẩu</label>
            <input class="form-control" type="password" formControlName="confirmPassword">
            <div class="text-danger small"
              *ngIf="f.confirmPassword.touched && f.confirmPassword.hasError('passwordMismatch')">
              Mật khẩu không khớp
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Số điện thoại</label>
            <input class="form-control" formControlName="phone">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Mã quốc gia (VD: VN, US)</label>
            <input class="form-control" formControlName="countryCode">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Mã bưu điện</label>
            <input class="form-control" formControlName="postalCode">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Địa chỉ dòng 1</label>
          <input class="form-control" formControlName="addressLine1">
        </div>

        <div class="mb-3">
          <label class="form-label">Địa chỉ dòng 2 (tuỳ chọn)</label>
          <input class="form-control" formControlName="addressLine2">
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Thành phố</label>
            <input class="form-control" formControlName="city">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Bang/Tỉnh</label>
            <input class="form-control" formControlName="state">
          </div>
        </div>

        <button class="btn btn-primary w-100" style="background-color: #ee4d2d;" [disabled]="form.invalid || loading">
          {{ loading ? 'Đang xử lý...' : 'Đăng ký' }}
        </button>
      </form>
    </div>
  </div>
</div>
