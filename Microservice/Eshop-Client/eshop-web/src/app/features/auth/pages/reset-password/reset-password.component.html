<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h3 class="mb-4">Đặt lại mật khẩu</h3>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Mật khẩu mới</label>
          <input class="form-control" type="password" formControlName="newPassword">
          <div class="text-danger small" *ngIf="f.newPassword.touched && f.newPassword.hasError('weakPassword')">
            Mật khẩu tối thiểu 6 ký tự, gồm chữ và số
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Xác nhận mật khẩu</label>
          <input class="form-control" type="password" formControlName="confirm">
          <div class="text-danger small" *ngIf="f.confirm.touched && f.confirm.hasError('passwordMismatch')">
            Mật khẩu không khớp
          </div>
        </div>
        <button class="btn btn-primary w-100" [disabled]="form.invalid || loading">Cập nhật mật khẩu</button>
      </form>
    </div>
  </div>
</div>
