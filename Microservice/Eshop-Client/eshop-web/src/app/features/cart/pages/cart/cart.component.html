<div class="container py-3">
  <h3 class="mb-3">Giỏ hàng</h3>

  <div *ngIf="loading" class="alert alert-info">Đang tải...</div>
  <div *ngIf="!loading && (!view || view.itemCount === 0)" class="alert alert-warning">Chưa có sản phẩm.</div>

  <div *ngIf="view && view.itemCount > 0" class="row">
    <div class="col-lg-8">
      <div class="list-group mb-3">
        <div class="list-group-item" *ngFor="let it of view.items">
          <div class="d-flex">
            <img [src]="it.image" alt="" width="72" height="72" class="me-3 rounded border">
            <div class="flex-grow-1">
              <div class="fw-semibold">{{ it.name }}</div>
              <div class="small text-muted">Đơn giá: ${{ unitPrice(it) }}</div>

              <div class="mt-2 d-flex align-items-center">
                <div class="input-group input-group-sm" style="width: 140px;">
                  <button class="btn btn-outline-secondary" (click)="dec(it)">&minus;</button>
                  <input class="form-control text-center" [value]="it.quantity"
                    (change)="onManualChange(it, $any($event.target).value)">
                  <button class="btn btn-outline-secondary" (click)="inc(it)">&plus;</button>
                </div>

                <div class="ms-auto text-end">
                  <div class="fw-semibold">Subtotal: ${{ subtotalOf(it) }}</div>
                  <button class="btn btn-link text-danger p-0 small" (click)="remove(it)">Xóa</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-outline-danger" (click)="clear()">Xóa toàn bộ</button>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-header">Tổng</div>
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <span>Tổng SL</span>
            <strong>{{ view.totalQuantity }}</strong>
          </div>
          <div class="d-flex justify-content-between">
            <span>Tạm tính</span>
            <strong>${{ (view.totalAmount || 0) | number:'1.2-2' }}</strong>
          </div>
        </div>
        <div class="card-footer text-end">
          <button class="btn btn-primary" (click)="checkout()">Proceed To Checkout</button>
        </div>
      </div>
    </div>
  </div>
</div>
