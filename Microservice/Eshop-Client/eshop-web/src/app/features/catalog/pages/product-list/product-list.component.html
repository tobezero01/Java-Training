<div class="row g-3">
  <div class="col-md-3 col-lg-3">
    <div class="bg-white p-3 rounded shadow-sm h-100">
      <h6 class="mb-3 fw-bold text-uppercase text-secondary border-bottom pb-2" style="font-size: 0.85rem;">
        <i class="bi bi-list-ul me-1"></i> Category
      </h6>

      <ng-container *ngIf="!loadingTree() && catTree().length; else loadingTreeTpl">
        <app-category-tree [tree]="catTree()"></app-category-tree>
      </ng-container>

      <ng-template #loadingTreeTpl>
        <div class="text-center py-3 text-muted fst-italic">
          <span class="spinner-border spinner-border-sm me-1"></span> Loading...
        </div>
      </ng-template>
    </div>
  </div>

  <div class="col-md-9 col-lg-9">

    <div class="bg-white p-3 rounded shadow-sm mb-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <h5 class="m-0 fw-bold text-dark">
        <ng-container *ngIf="selectedCat(); else homeTitle">
          {{ selectedCat()?.name }}
        </ng-container>
        <ng-template #homeTitle>Khám phá sản phẩm</ng-template>
      </h5>

      <div class="d-flex align-items-center gap-2 flex-grow-1 flex-md-grow-0 justify-content-end">
        <div class="input-group input-group-sm" style="max-width: 250px;">
          <input class="form-control" placeholder="Tìm kiếm sản phẩm..." [value]="keyword()" #searchInput
            (keyup.enter)="goSearch(searchInput.value)">
          <button class="btn btn-outline-secondary" (click)="goSearch(searchInput.value)">
            <i class="fa fa-search"></i>
          </button>
        </div>

        <select class="form-select form-select-sm" style="width: 130px;" [value]="sort()" #selectInput
          (change)="changeSort(selectInput.value)">
          <option value="name|asc">Tên: A-Z</option>
          <option value="name|desc">Tên: Z-A</option>
          <option value="price|asc">Giá: Thấp -> Cao</option>
          <option value="price|desc">Giá: Cao -> Thấp</option>
        </select>
      </div>
    </div>

    <!-- parent cấp cao -->
    <div class="bg-white p-3 rounded shadow-sm min-vh-100">

      <div *ngIf="!keyword() && !selectedCat()">
        <h6 class="text-muted mb-3 small fw-bold text-uppercase">Danh mục nổi bật</h6>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3">
          <div class="col" *ngFor="let c of topCats()">
            <div class="card h-100 border-0 shadow-sm cat-card" (click)="goCat(c.id)">
              <div class="p-3 text-center">
                <img [src]="c.imagePath ? 'assets' + c.imagePath : 'assets/image.png'" [alt]="c.name"
                  class="img-fluid mb-2" style="height: 80px; object-fit: contain;">
                <div class="fw-semibold text-dark small">{{ c.name }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="selectedCat()">
        <div class="mb-4" *ngIf="childCats().length">
          <h6 class="text-muted small mb-2">Danh mục con:</h6>

          <div class="d-flex flex-nowrap gap-2 overflow-auto pb-2 scroll-hide">

            <div class="card cat-chip-card flex-shrink-0" style="min-width: max-content; cursor: pointer"
              *ngFor="let c of childCats()" (click)="goCat(c.id)">
              <div class="d-flex align-items-center p-2 pe-3">
                <img [src]="c.imagePath ? 'assets/category-images/' + c.id + '/' + c.imagePath : 'assets/image.png'"
                  class="rounded me-2" style="width: 30px; height: 30px; object-fit: cover;">
                <span class="small fw-semibold">{{ c.name }}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-5 g-3">
          <div class="col" *ngFor="let p of items()">
            <app-product-card [p]="p"></app-product-card>
          </div>
        </div>

        <nav class="mt-5 d-flex justify-content-center" *ngIf="totalPages() > 1">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="page()<=1">
              <button class="page-link" (click)="goPage(page()-1)">
                <span aria-hidden="true">&laquo;</span>
              </button>
            </li>
            <li class="page-item disabled">
              <span class="page-link fw-bold text-dark px-3">{{page()}} / {{totalPages()}}</span>
            </li>
            <li class="page-item" [class.disabled]="page()>=totalPages()">
              <button class="page-link" (click)="goPage(page()+1)">
                <span aria-hidden="true">&raquo;</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>

      <div *ngIf="keyword()">
        <h6 class="mb-3 text-muted">Kết quả tìm kiếm cho: <span class="text-primary">"{{keyword()}}"</span></h6>

        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-5 g-3">
          <div class="col" *ngFor="let p of items()">
            <app-product-card [p]="p"></app-product-card>
          </div>
        </div>

        <nav class="mt-5 d-flex justify-content-center" *ngIf="totalPages() > 1">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="page()<=1">
              <a class="page-link" (click)="goPage(page()-1)">&laquo;</a>
            </li>
            <li class="page-item disabled">
              <span class="page-link">{{page()}} / {{totalPages()}}</span>
            </li>
            <li class="page-item" [class.disabled]="page()>=totalPages()">
              <a class="page-link" (click)="goPage(page()+1)">&raquo;</a>
            </li>
          </ul>
        </nav>

        <div *ngIf="items().length === 0" class="text-center py-5">
          <i class="bi bi-search text-muted display-4"></i>
          <p class="mt-3 text-muted">Không tìm thấy sản phẩm nào phù hợp.</p>
        </div>
      </div>

    </div>
  </div>
</div>
