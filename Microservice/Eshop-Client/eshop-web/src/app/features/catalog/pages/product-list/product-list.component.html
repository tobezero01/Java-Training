<div class="row g-3">
  <!-- Sidebar: Category tree -->
  <div class="col-md-3">
    <h6 class="mb-2">Danh mục</h6>
    <ng-container *ngIf="catTree().length; else loadingTree">
      <app-category-tree [tree]="catTree()"></app-category-tree>
    </ng-container>
    <ng-template #loadingTree>Đang tải danh mục...</ng-template>
  </div>

  <!-- Main -->
  <div class="col-md-9">
    <!-- Thanh search + sort -->
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h6 class="m-0">
        <ng-container *ngIf="selectedCat(); else homeTitle">
          {{ selectedCat()?.name }}
        </ng-container>
        <ng-template #homeTitle>Danh mục sản phẩm</ng-template>
      </h6>
      <div class="d-flex align-items-center gap-2">
        <input class="form-control form-control-sm" placeholder="Tìm kiếm..." [value]="keyword()" #searchInput
          (keyup.enter)="goSearch(searchInput.value)">
        <select class="form-select form-select-sm" [value]="sort()" #selectInput
          (change)="changeSort(selectInput.value)">
          <option value="name|asc">Tên ↑</option>
          <option value="name|desc">Tên ↓</option>
          <option value="price|asc">Giá ↑</option>
          <option value="price|desc">Giá ↓</option>
        </select>
      </div>
    </div>

    <!-- 1) HOME: hiển thị parent categories -->
    <div *ngIf="!keyword() && !selectedCat()">
      <div class="row row-cols-2 row-cols-md-3 g-3">
        <div class="col" *ngFor="let c of topCats()">
          <div class="card h-100" (click)="goCat(c.id)" style="cursor:pointer">
            <img class="card-img-top" [src]="c.imagePath || 'https://via.placeholder.com/400x250?text=Category'"
              [alt]="c.name">
            <div class="card-body text-center">
              <div class="fw-semibold">{{ c.name }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2) Khi đã chọn category: hiển thị child categories hàng trên + product list -->
    <div *ngIf="selectedCat()">
      <!-- Child categories row -->
      <div class="mb-3" *ngIf="childCats().length">
        <div class="d-flex flex-wrap gap-2">
          <div class="card p-2 flex-grow-0 flex-shrink-0" style="width: 140px; cursor: pointer"
            *ngFor="let c of childCats()" (click)="goCat(c.id)">
            <img class="card-img-top" [src]="c.imagePath || 'https://via.placeholder.com/140x80?text=Category'"
              [alt]="c.name">
            <div class="small text-center mt-1">{{ c.name }}</div>
          </div>
        </div>
      </div>

      <!-- Product grid -->
      <div class="row row-cols-2 row-cols-md-3 g-3">
        <div class="col" *ngFor="let p of items()">
          <app-product-card [p]="p"></app-product-card>
        </div>
      </div>

      <!-- Pagination -->
      <nav class="mt-3" *ngIf="totalPages() > 1">
        <ul class="pagination pagination-sm">
          <li class="page-item" [class.disabled]="page()<=1">
            <a class="page-link" (click)="goPage(page()-1)">Prev</a>
          </li>
          <li class="page-item disabled">
            <span class="page-link">{{page()}} / {{totalPages()}}</span>
          </li>
          <li class="page-item" [class.disabled]="page()>=totalPages()">
            <a class="page-link" (click)="goPage(page()+1)">Next</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- 3) Khi search (keyword != '') đã xử lý trong TS: không hiển thị topCats, chỉ show items -->
    <div *ngIf="keyword()">
      <div class="row row-cols-2 row-cols-md-3 g-3">
        <div class="col" *ngFor="let p of items()">
          <app-product-card [p]="p"></app-product-card>
        </div>
      </div>
      <nav class="mt-3" *ngIf="totalPages() > 1">
        <ul class="pagination pagination-sm">
          <li class="page-item" [class.disabled]="page()<=1">
            <a class="page-link" (click)="goPage(page()-1)">Prev</a>
          </li>
          <li class="page-item disabled">
            <span class="page-link">{{page()}} / {{totalPages()}}</span>
          </li>
          <li class="page-item" [class.disabled]="page()>=totalPages()">
            <a class="page-link" (click)="goPage(page()+1)">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
