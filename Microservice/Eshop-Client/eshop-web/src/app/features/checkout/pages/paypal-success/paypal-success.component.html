<div class="container py-5 min-vh-75 d-flex align-items-center justify-content-center">

  <div class="card border-0 shadow-lg text-center p-4 p-md-5 success-card" style="max-width: 500px; width: 100%;">
    <div class="card-body">

      <div class="mb-4">
        <div class="success-icon-container mx-auto">
          <i class="bi bi-check-lg text-white fs-1"></i>
        </div>
      </div>

      <h2 class="fw-bold text-dark mb-2">Đặt hàng thành công!</h2>
      <p class="text-muted mb-4">
        Cảm ơn bạn đã mua sắm tại eShop. Đơn hàng của bạn đang được xử lý.
      </p>

      <div class="bg-light rounded p-3 mb-4 border border-dashed">
        <div class="small text-muted text-uppercase fw-bold">Mã đơn hàng</div>
        <div class="fs-4 fw-bold text-primary">#{{ orderNumber || 'Processing...' }}</div>
        <div class="small text-muted mt-1">
          <i class="bi bi-envelope me-1"></i> Email xác nhận đã được gửi tới bạn.
        </div>
      </div>

      <div class="d-flex flex-column gap-2">
        <a routerLink="/orders" class="btn btn-primary btn-lg shadow-sm">
          <i class="bi bi-box-seam me-2"></i>Quản lý đơn hàng
        </a>

        <a routerLink="/catalog" class="btn btn-outline-secondary btn-lg border-0">
          <i class="bi bi-arrow-left me-2"></i>Tiếp tục mua sắm
        </a>
      </div>

    </div>
  </div>

</div>
