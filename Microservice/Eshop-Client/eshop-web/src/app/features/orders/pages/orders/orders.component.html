<div class="card shadow-sm">
  <div class="card-header bg-light">
    <h5 class="mb-0">Lịch sử đơn hàng</h5>
  </div>

  <div class="card-body p-0">
    <div *ngIf="loading" class="p-3 alert alert-info mb-0">Đang tải...</div>

    <div *ngIf="!loading && items.length === 0" class="p-3 alert alert-warning mb-0">
      Bạn chưa có đơn hàng nào.
    </div>

    <div class="table-responsive" *ngIf="!loading && items.length">
      <table class="table table-sm mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th style="width: 160px;">Mã đơn</th>
            <th style="width: 180px;">Ngày đặt</th>
            <th>Trạng thái</th>
            <th>Thanh toán</th>
            <th class="text-end">Tổng tiền</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of items" (click)="goDetail(o)" style="cursor: pointer;">
            <td class="fw-semibold text-primary">{{ o.orderNumber }}</td>
            <td>{{ o.orderTime | date:'short' }}</td>
            <td>{{ o.status }}</td>
            <td>{{ o.paymentMethod }}</td>
            <td class="text-end">
              ${{ o.paymentTotal | number:'1.2-2' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center" *ngIf="totalPages > 1">
    <button class="btn btn-sm btn-outline-secondary" [disabled]="page <= 1" (click)="load(page - 1)">
      Prev
    </button>
    <span class="small">Trang {{ page }} / {{ totalPages }}</span>
    <button class="btn btn-sm btn-outline-secondary" [disabled]="page >= totalPages" (click)="load(page + 1)">
      Next
    </button>
  </div>
</div>
